<!DOCTYPE html>
<html lang="ko"> <!--en, ko 등 언어설정-->

<head>
    <meta charset="UTF-8"> <!--인코딩 방식 선언-->

    <!--브라우저가 페이지를 어떻게 처리하고 표시해야 하는지에 대한 중요한 정보를 전달-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons1</title>
</head>

<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
    <!--p 태그 : 문장을 쓰는 공간-->
    <p>안녕하세요.<br /> 저는 해피두리안입니다.</p>
    <!-- br : 줄바꿈 태그, /앞에 꼭 한칸 띄어줘야함-->
    <!--글씨 두껍게-->
    <b></b>
    <strong></strong>
    <!--이탤릭-->
    <i></i>
    <!--기울여서 강조하기-->
    <em></em>
    <!--중간줄-->
    <del></del>
    <!--밑줄-->
    <u></u>
    <!--목록을 보는 태그
    ul : 순서 없는 목록을 나타냄
    li : ul이나 ol태그 안에 list 작성-->
    <ul>
        <li><b>푸드덕</b> *b</li>
        <li><strong>하자드도메인:어비스</strong> *strong</li>
        <li><i>코드런</i> *i</li>
    </ul>
    <!-- 속성 추가
    ul태그 마커 모양 : disc(기본모양),circle, square, none-->
    <ul type="circle">
        <li><em>푸드덕</em> *em</li>
        <li><del>하자드도메인:어비스</del> *del</li>
        <li><u>코드런</u> *u</li>
    </ul>

    <!-- ol : 순서 있는 목록을 나타냄-->
    <ol>
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ol>
    <!-- ol 태그 마커 모양(속성) : 1, A, I, a, i 
    start : 시작번호
    reversed : 역순   -->
    <ol type="1" , start="10" reversed>
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ol>
    <!--이미지 파일을 직접가져오거나 인터넷 주소에서 가져오기 *항상 속성이 있어야함-->
    <img src="https://i.namu.wiki/i/r6UrYH6e7yXAZ5VrGVRq6oixAIjdxFUQ8ZkxT0AsGfhBFSygdaAYox4FiG8XvQEGF0UDg5_d1aO_Oe0ShV9El3NgBuUrPtS_itvjQ-O6F8uBAonuIwgjjUX4r0o3dCIA0ElAfcowYjw-mFpEBV4NlA.webp"
        alt="슬기" />

    <!--인라인 태그로서, 페이지를 이동하는 하이퍼링크다.-->
    <div>
        <a href="https://namu.wiki/w/%EC%8A%AC%EA%B8%B0(Red%20Velvet)" target="_blank">나무위키</a>
        <a href="https://www.youtube.com/watch?v=MucMEDxBIR0&list=RDMucMEDxBIR0&start_radio=1" target="_blank">직캠
            유튜브</a>
        <a href="https://www.instagram.com/hi_sseulgi/" target="_blank">인스타그램</a>
    </div>
    <!--span 태그 : inline태그로, div안에 들어가는 경우가 많고 한줄에 들어감-->
    <div>
        <span>Hi.</span><span>nice</span>
        <span style="color: aquamarine;">Hi.</span><span>nice</span>
    </div>

    <form>
        <input type="button" value="전송" />
        <button>버튼</button> <!--기본값이 서버로 제출임-->
        <button type="button">버튼1</button><br /> <!--이건 type을 바꿨기 때문에 서버로 전송이 아닌 그냥 버튼이 됌, 기능역할을 하게 됌
    저기다가 type = "submit"을 하게 되면 기본값이 되는 것-->

        <!--placeholder 속성 : 사용자에게 어떠한 값을 입력하라고 안내해주는 역할-->
        <!-- value 속성 : 기본값으로 들어가있음. 그러나 지울 수는 있음-->
        <input type="text" placeholder="이름" value="wow" /><br />
        <input type="text" placeholder="이름" value="Good" readonly /><br /> <!--readonly : 읽을 수만 있음-->
        <input type="password" placeholder="비밀번호" /><br />

        <!--체크박스 속성 : 여러개 체크 가능, value는 서버로 보내주는 값이고, >옆에 값은 사용자에게 보여지는 값 
    여기선 food라는 체크박스 하나에 들어가있는 박스들임, on/off 이기 때문에 하나를 선택할수도 , 안할수도, 여러개 할수도 있는 경우엔 체크박스
    checked : 기본값으로 체크가 되어있는 것, 해제가능-->
        <input type="checkbox" name="food" value="pizza" />피자<br />
        <input type="checkbox" name="food" value="chicken" checked />치킨<br />

        <!--radio : 여러 선택지 중 하나만 선택 가능, 무조건 하나는 선택해야할때 사용함! , name이 같은 것 중에 하나를 선택하게끔 함!-->
        <input type="radio" name="hobby" value="camping" />캠핑<br />
        <input type="radio" name="hobby" value="hiking" />등산<br />
        <input type="radio" name="hobby" value="swimming" />수영<br />
        <!--이렇게 이름이 다르면 여러개 선택 가능함!-->
        <input type="radio" name="hobby_1" value="camping" />캠핑<br />

        <!-- date : 날짜가 생성됌-->
        <input type="date" /><br />
        <input type="time" /><br />
        <input type="datetime-local" /><br /> <!--년월일, 시간까지 전부다 선택가능-->

        <!--select : 선택 메뉴를 만드는 tag임. value를 꼭 해줘야한다. 이유는 그래야 서버에 들어가기 떄문.-->
        <select>
            <optgroup label="아시아">
                <option value="korea">대한민국</option>
                <option value="japan">일본</option>
                <option value="china" disabled>중국</option>
                <!--disabled : 아예 선택이 안되게 만드는 것. Input에다가도 넣을 수 있음, 서버에도 안보내짐-->
            </optgroup>
            <optgroup label="북아메리카">
                <option value="u.s.a">미국</option>
                <option value="canada">캐나다</option>
            </optgroup>

        </select>
        
    </form>
    <form action="https://webhook.site/1f34afe9-8579-44fc-8f56-7748b910de80" method="post">
        <input type="text" name="username" placeholder="사용자 이름" />
        <input type="submit" value="전송" />
    </form>
</body>

</html>
