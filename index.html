<!DOCTYPE html>
<html lang="ko"> <!--en, ko 등 언어설정-->
<head>
    <meta charset="UTF-8"> <!--인코딩 방식 선언-->

    <!--브라우저가 페이지를 어떻게 처리하고 표시해야 하는지에 대한 중요한 정보를 전달-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons1</title>
</head>
<body>
    <h1>Heading 1</h1> 
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
    <!--p 태그 : 문장을 쓰는 공간-->
    <p>안녕하세요.<br /> 저는 해피두리안입니다.</p>
    <!-- br : 줄바꿈 태그, /앞에 꼭 한칸 띄어줘야함-->
     <!--글씨 두껍게-->
    <b></b>
    <strong></strong>
    <!--이탤릭-->
    <i></i>
    <!--기울여서 강조하기-->
    <em></em>
    <!--중간줄-->
    <del></del>
    <!--밑줄-->
    <u></u>
    <!--목록을 보는 태그
    ul : 순서 없는 목록을 나타냄
    li : ul이나 ol태그 안에 list 작성-->
    <ul> 
        <li><b>푸드덕</b> *b</li>
        <li><strong>하자드도메인:어비스</strong> *strong</li>
        <li><i>코드런</i> *i</li>
    </ul>
    <!-- 속성 추가
    ul태그 마커 모양 : disc(기본모양),circle, square, none-->
    <ul type = "circle"> 
        <li><em>푸드덕</em> *em</li>
        <li><del>하자드도메인:어비스</del> *del</li>
        <li><u>코드런</u> *u</li>
    </ul>

    <!-- ol : 순서 있는 목록을 나타냄-->
    <ol> 
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ol>
    <!-- ol 태그 마커 모양(속성) : 1, A, I, a, i 
    start : 시작번호
    reversed : 역순   -->
    <ol type = "1", start="10" reversed> 
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ol>
    <!--이미지 파일을 직접가져오거나 인터넷 주소에서 가져오기 *항상 속성이 있어야함-->
    <img src ="https://i.namu.wiki/i/r6UrYH6e7yXAZ5VrGVRq6oixAIjdxFUQ8ZkxT0AsGfhBFSygdaAYox4FiG8XvQEGF0UDg5_d1aO_Oe0ShV9El3NgBuUrPtS_itvjQ-O6F8uBAonuIwgjjUX4r0o3dCIA0ElAfcowYjw-mFpEBV4NlA.webp" alt = "슬기" />

    <!--인라인 태그로서, 페이지를 이동하는 하이퍼링크다.-->
